version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: swc_db
    environment:
      POSTGRES_DB: swc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: swc_backend
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-dev-key
      - DB_NAME=swc_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=*
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    # Runs migrations, seeds the geography data, and starts the Django server
    command: >
      sh -c "python manage.py migrate &&
             python seed_geography.py &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: swc_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
